version: '3.8'

services:
  app:
    build: .
    container_name: eduvolt-pro-app
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./storage:/var/www/html/storage
      - ./bootstrap/cache:/var/www/html/bootstrap/cache
      - ./.env:/var/www/html/.env
    networks:
      - eduvolt-network
    depends_on:
      - mysql

  mysql:
    image: mysql:8.0
    container_name: eduvolt-pro-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3307:3306"
    networks:
      - eduvolt-network

volumes:
  mysql_data:


networks:
  eduvolt-network:
    driver: bridge
